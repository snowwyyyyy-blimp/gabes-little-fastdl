// ============================================
// FastDL Download Settings
// Add these lines to C:\TF2server\tf\cfg\server.cfg
// ============================================

// Enable client downloads
sv_allowdownload 1
sv_allowupload 0

// FastDL URL - Replace with your Cloudflare Pages URL
// Example: sv_downloadurl "https://tf2-fastdl.pages.dev/tf"
sv_downloadurl "REPLACE_WITH_YOUR_CLOUDFLARE_PAGES_URL/tf"

// Max download size per file (bytes) - 100MB
sv_maxdownloadsize 104857600
